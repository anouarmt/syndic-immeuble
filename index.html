<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registre du Syndic</title>
<meta name="description" content="Gestion de syndic d'immeuble : étages, lots, cotisations, dépenses, impayés et états imprimables.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 34 40%22%3E%3Crect x=%223%22 y=%224%22 width=%2228%22 height=%2235%22 rx=%222%22 fill=%22%231D58A6%22/%3E%3Crect width=%2234%22 height=%225%22 y=%221%22 rx=%221.5%22 fill=%22%232A3442%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
html{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* Layout : barre latérale de navigation + espace de travail ; la vue Immeuble dessine la façade étage par étage */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D3D9E0; --line-2:#E3E7EC;
  --ink:#18212C; --muted:#5B6674; --accent:#1D58A6; --accent-soft:#E2EBF7; --accent-ink:#FFFFFF;
  --ok:#1C7A4B; --ok-bg:#E0F2E8; --warn:#93600A; --warn-bg:#FAEFD6; --bad:#AE2A21; --bad-bg:#FAE3E0;
  --exp:#C27A1E; --roof:#2A3442; --roof-ink:#EEF2F6; --ground:#C9D0D8; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151A; --surface:#1A2027; --surface-2:#20272F; --line:#2F3844; --line-2:#262E38;
  --ink:#E5E9EE; --muted:#97A2AF; --accent:#6FA3EA; --accent-soft:#1E2E44; --accent-ink:#0E1620;
  --ok:#5DC08B; --ok-bg:#163126; --warn:#E2AE52; --warn-bg:#352A12; --bad:#F27E73; --bad-bg:#3B1C1A;
  --exp:#E3A456; --roof:#0B0E12; --roof-ink:#D9DEE4; --ground:#2A323C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151A; --surface:#1A2027; --surface-2:#20272F; --line:#2F3844; --line-2:#262E38;
  --ink:#E5E9EE; --muted:#97A2AF; --accent:#6FA3EA; --accent-soft:#1E2E44; --accent-ink:#0E1620;
  --ok:#5DC08B; --ok-bg:#163126; --warn:#E2AE52; --warn-bg:#352A12; --bad:#F27E73; --bad-bg:#3B1C1A;
  --exp:#E3A456; --roof:#0B0E12; --roof-ink:#D9DEE4; --ground:#2A323C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem} h2{font-size:1.2rem} h3{font-size:1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{width:34px;height:40px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15}
.brand-sub{font-size:.75rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.caisse{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.caisse .num{font-size:1.05rem;font-weight:500}
.mode-pill{font-size:.72rem;color:var(--muted)}

.main{min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.topbar .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:64px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.year-sel{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:2px}
.year-sel span{font-family:var(--f-mono);min-width:3.2em;text-align:center;font-weight:500}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:1.32rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.neg .v{color:var(--bad)} .kpi.pos .v{color:var(--ok)}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.neutral{color:var(--muted);background:var(--surface-2)}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.ex-badge{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 5px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .input{width:auto;min-width:130px}
.filters .search{flex:1 1 200px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{color:var(--ink)}

/* ---------- chart ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;font-size:.84rem}
.hbar .bar{grid-column:1/-1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.hbar .bar i{display:block;height:100%;background:var(--exp)}

/* ---------- facade ---------- */
.facade{display:flex;flex-direction:column;max-width:100%}
.roof{background:var(--roof);color:var(--roof-ink);border-radius:10px 10px 0 0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.roof::before{content:"";position:absolute;left:24px;right:24px;top:-7px;height:7px;background:var(--roof);border-radius:4px 4px 0 0;opacity:.75}
.roof h2{font-size:1.05rem}
.roof .sub{font-size:.78rem;opacity:.75}
.floor{display:grid;grid-template-columns:112px minmax(0,1fr);border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.floor-tag{padding:12px;border-right:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.floor-tag .nm{font-family:var(--f-display);font-weight:700;font-size:.95rem}
.floor-tag .ft{display:flex;gap:2px}
.units{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;align-content:start}
.unit{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0;position:relative}
.unit:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.unit .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.unit .no{font-family:var(--f-mono);font-weight:500;font-size:1rem}
.unit .owner{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .due{font-family:var(--f-mono);font-size:.78rem}
.unit.warn{background:linear-gradient(var(--warn),var(--warn)) top/100% 4px no-repeat,var(--surface)}
.unit.bad{background:linear-gradient(var(--bad),var(--bad)) top/100% 4px no-repeat,var(--surface)}
.unit.ok{background:linear-gradient(var(--ok),var(--ok)) top/100% 4px no-repeat,var(--surface)}
.unit-add{border:1px dashed var(--line);border-radius:4px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:92px;font-weight:500}
.unit-add:hover{color:var(--accent);border-color:var(--accent)}
.ground{height:14px;background:repeating-linear-gradient(135deg,var(--ground) 0 6px,transparent 6px 12px);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.legend-status{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- grille de suivi ---------- */
table.grid{border-collapse:separate;border-spacing:0;font-size:.82rem;min-width:100%}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line-2)}
.grid th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 4px;text-align:center;background:var(--surface);position:sticky;top:0}
.grid .stick{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:7px 12px;min-width:170px;border-right:1px solid var(--line)}
.grid th.stick{z-index:2}
.grid .fl td{background:var(--surface-2);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 12px}
.grid .fl td.stick{background:var(--surface-2)}
.cell{width:100%;min-width:46px;height:34px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cell span{width:30px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-family:var(--f-mono)}
.cell.paid span{background:var(--ok-bg);color:var(--ok)}
.cell.unpaid span{background:var(--bad-bg);color:var(--bad);font-weight:600}
.cell.future span{border:1px dashed var(--line);color:var(--muted)}
.cell.pre span{color:var(--line)}
.cell:hover span{outline:2px solid var(--accent);outline-offset:1px}
.grid td.tot{padding:7px 10px;text-align:right;font-family:var(--f-mono);white-space:nowrap}
.grid tfoot td{background:var(--surface-2);font-family:var(--f-mono);font-size:.74rem;text-align:center;padding:7px 4px;border-top:1px solid var(--line)}
.grid tfoot td.stick{background:var(--surface-2);font-family:var(--f-body);font-weight:600}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 28px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.sheet.wide{max-width:820px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mchip{position:relative}
.mchip input{position:absolute;opacity:0;pointer-events:none}
.mchip label{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);border-radius:6px;padding:6px 2px;cursor:pointer;font-size:.8rem;font-weight:500;user-select:none}
.mchip label small{font-size:.64rem;color:var(--muted);font-weight:400}
.mchip input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mchip input:checked + label small{color:inherit;opacity:.85}
.mchip input:disabled + label{background:var(--ok-bg);color:var(--ok);border-color:transparent;cursor:not-allowed}
.mchip input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.mchip.due label{border-color:var(--bad)}
.note-box{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:.84rem}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.88rem}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.mlist{display:flex;flex-wrap:wrap;gap:5px}

/* reçu */
.recu{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.recu-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.recu .big{font-family:var(--f-mono);font-size:1.4rem;font-weight:500}
.recu .lettres{font-style:italic;font-size:.88rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list-plain li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);align-items:center}
.list-plain li:last-child{border-bottom:0}
.sign-in{color:var(--ok)} .sign-out{color:var(--bad)}

/* ---------- états imprimables (aperçu papier : volontairement blanc dans les deux thèmes) ---------- */
.et-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.et-bar .field{min-width:180px}
.paper-wrap{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding-block:20px;padding-left:16px;padding-right:16px}
.paper{background:#FFFFFF;color:#161C24;width:100%;max-width:820px;margin:0 auto;padding:30px 34px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:var(--f-body);font-size:12px;line-height:1.45;color-scheme:light}
.paper.land{max-width:1120px;min-width:900px}
.paper{min-width:640px}
.paper + .paper{margin-top:18px}
.pp-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #161C24;padding-bottom:10px;margin-bottom:14px}
.pp-h h2{font-family:var(--f-display);font-size:18px;color:#161C24}
.pp-h .s{color:#5A6472;font-size:11px}
.pp-h .r{text-align:right}
.pp-sec{font-family:var(--f-display);font-weight:700;font-size:13px;margin:16px 0 6px;color:#161C24}
.pp-boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pp-box{border:1px solid #CBD2DA;border-radius:4px;padding:8px 10px}
.pp-box .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#5A6472;font-weight:600}
.pp-box .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.pp-box.bad .v{color:#AE2A21} .pp-box.ok .v{color:#1C7A4B}
table.pp{width:100%;border-collapse:collapse;font-size:11px;color:#161C24}
.pp th{background:#18212C;color:#FFFFFF;font-weight:600;text-align:left;padding:5px 6px;font-size:10px;white-space:nowrap}
.pp td{border:1px solid #D5DBE2;padding:4px 6px;vertical-align:top}
.pp td.r,.pp th.r{text-align:right} .pp td.c,.pp th.c{text-align:center}

<script>
(() => {
'use strict';
/* ================= constantes & utilitaires ================= */
const MOIS = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
const MOIS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const CATS = ['Électricité parties communes','Eau','Nettoyage','Gardiennage / concierge','Ascenseur','Entretien & réparations','Jardinage','Assurance immeuble','Fournitures','Frais bancaires','Honoraires syndic','Divers'];
const MODES = ['Espèces','Virement','Chèque','Versement bancaire'];
const TYPES_LOT = ['Appartement','Magasin','Bureau','Garage'];
const NOW = new Date();
const CUR_KEY = ym(NOW.getFullYear(), NOW.getMonth()+1);
const TODAY = NOW.toISOString().slice(0,10);
const COLS = ['etages','apparts','paiements','depenses'];

function ym(y,m){return y+'-'+String(m).padStart(2,'0')}
function keyParts(k){return [ +k.slice(0,4), +k.slice(5,7) ]}
function nextKey(k){let [y,m]=keyParts(k);m++;if(m>12){m=1;y++}return ym(y,m)}
function monthRange(a,b){const out=[];if(!a||!b||a>b)return out;let k=a;while(k<=b){out.push(k);k=nextKey(k);if(out.length>600)break}return out}
function keyLabel(k){const [y,m]=keyParts(k);return MOIS[m-1]+' '+y}
function keyLong(k){const [y,m]=keyParts(k);return MOIS_L[m-1]+' '+y}
const nf = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function dh(n){return nf.format(+n||0)+' DH'}
function dh0(n){return nf0.format(+n||0)+' DH'}
function fdate(d){if(!d)return '—';const [y,m,j]=d.split('-');return j+'/'+m+'/'+y}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function natCmp(a,b){return String(a).localeCompare(String(b),'fr',{numeric:true,sensitivity:'base'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function enLettres(n){
  const u=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d=['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const s100=n=>{if(n<20)return u[n];const t=Math.floor(n/10),r=n%10;
    if(t===7||t===9)return d[t]+(t===7&&r===1?' et ':'-')+u[10+r];
    if(r===0)return t===8?'quatre-vingts':d[t];
    if(r===1&&t!==8)return d[t]+' et un';return d[t]+'-'+u[r]};
  const s1000=n=>{const c=Math.floor(n/100),r=n%100;let s='';if(c)s=c===1?'cent':u[c]+' cent'+(r===0?'s':'');if(r)s+=(s?' ':'')+s100(r);return s};
  if(n===0)return 'zéro';const p=[],mi=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),re=n%1000;
  if(mi)p.push(s1000(mi)+' million'+(mi>1?'s':''));
  if(th)p.push(th===1?'mille':s1000(th).replace(/cents$/,'cent').replace(/vingts$/,'vingt')+' mille');
  if(re)p.push(s1000(re));return p.join(' ');
}
function montantLettres(x){const v=Math.round((+x||0)*100);const dhs=Math.floor(v/100),c=v%100;
  let s=enLettres(dhs)+' dirham'+(dhs>1?'s':'');if(c)s+=' et '+enLettres(c)+' centime'+(c>1?'s':'');return s.charAt(0).toUpperCase()+s.slice(1)}

const ICON = {
  tableau:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  immeuble:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-4h6v4M8 8h2M14 8h2M8 12h2M14 12h2"/><path d="M2 21h20"/></svg>',
  suivi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M9 4v17M15 4v17M3 15h18"/></svg>',
  paiements:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  depenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  parametres:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  etats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="1.5"/><path d="M7 14h10v7H7z"/><path d="M17 11h1"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  recu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 9l2 2 4-4"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
  wand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20L16 8M14 4v3M18 8h3M17 3l-1.5 1.5M20 6l-1.5 1.5"/></svg>'
};
const VIEWS = [['tableau','Tableau de bord'],['immeuble','Immeuble'],['suivi','Suivi des cotisations'],['etats','États imprimables'],['paiements','Paiements'],['depenses','Dépenses'],['parametres','Paramètres']];

/* ================= état ================= */
const S = {
  config:{}, etages:[], apparts:[], paiements:[], depenses:[],
  year: NOW.getFullYear(), view: 'tableau', immMode:'facade', canWrite:true, mode:'loading', loaded:{},
  fp:{q:'',appart:'',mois:'',mode:''}, fd:{q:'',cat:'',mois:''}, et:{type:'global',lot:''}
};
try{ const v=localStorage.getItem('syndic-view'); if(v && VIEWS.some(x=>x[0]===v)) S.view=v; }catch(e){}
try{ const h=location.hash.slice(1); if(VIEWS.some(x=>x[0]===h)) S.view=h; }catch(e){}

/* ================= stockage : Supabase, accès par code ================= */
const CFG = window.SYNDIC_CONFIG || {};
const SB = (window.supabase && CFG.url && CFG.key && !/VOTRE/.test(CFG.url)) ? window.supabase.createClient(CFG.url, CFG.key, {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}) : null;
const A = { ready:false, keys:[], imms:[], role:null, code:null, msg:'', busy:false, adding:false, err:'' };
let IMM = null;
const ROLE_LBL = {admin:'Administrateur', gestion:'Gestion', lecture:'Lecture seule'};
const RANK = {admin:3, gestion:2, lecture:1};
function denied(){ const e=new Error('denied'); e.code='denied'; return e; }
function savedCodes(){ try{ const v=JSON.parse(localStorage.getItem('syndic-codes')||'[]'); return Array.isArray(v)?v.filter(x=>typeof x==='string'):[] }catch(e){ return [] } }
function storeCodes(list){ try{ localStorage.setItem('syndic-codes',JSON.stringify([...new Set(list)])) }catch(e){} }
async function rpc(fn,args){ const {data,error}=await SB.rpc(fn,args); if(error) throw error; return data; }
function mergeKeys(){
  const m=new Map();
  A.keys.forEach(k=>k.imms.forEach(i=>{ const cur=m.get(i.id); if(!cur||RANK[k.role]>RANK[cur.role]) m.set(i.id,{id:i.id,nom:i.nom,role:k.role,code:k.code}); }));
  A.imms=[...m.values()];
}
async function openCode(code){
  const r=await rpc('syndic_ouvrir',{p_code:code});
  if(!r||r.erreur) return r||{erreur:'code'};
  A.keys=A.keys.filter(k=>k.code!==code); A.keys.push({code,role:r.role,imms:r.immeubles||[]});
  storeCodes([...savedCodes(),code]); mergeKeys(); return r;
}
const Store = {
  async start(){
    const codes=savedCodes(); A.keys=[]; const ok=[];
    for(const c of codes){ try{ const r=await rpc('syndic_ouvrir',{p_code:c}); if(r&&!r.erreur){ A.keys.push({code:c,role:r.role,imms:r.immeubles||[]}); ok.push(c); } else if(r&&r.erreur==='bloque'){ ok.push(c); } }catch(e){ ok.push(c); throw e; } }
    storeCodes(ok); mergeKeys();
    let want=null; try{want=localStorage.getItem('syndic-imm')}catch(e){}
    const pick=A.imms.find(i=>i.id===want)||A.imms[0]||null;
    await this.open(pick?pick.id:null);
  },
  async open(id){
    IMM=id; try{ if(id) localStorage.setItem('syndic-imm',id) }catch(e){}
    COLS.forEach(c=>S[c]=[]); S.config={}; S.loaded={};
    const imm=A.imms.find(i=>i.id===id);
    if(!imm){ IMM=null; A.role=null; A.code=null; S.canWrite=false; S.mode=A.keys.some(k=>k.role==='admin')?'none':'code'; schedule(); return; }
    A.role=imm.role; A.code=imm.code; S.canWrite = imm.role==='admin'||imm.role==='gestion';
    S.mode='loading'; schedule();
    await this.reload(true);
  },
  async reload(first){
    if(!IMM) return;
    const r=await rpc('syndic_charger',{p_code:A.code,p_imm:IMM});
    if(!r){ // code modifié entre-temps : on l'oublie sur cet appareil
      storeCodes(savedCodes().filter(c=>c!==A.code)); A.keys=A.keys.filter(k=>k.code!==A.code); mergeKeys();
      if(first){ toast("Le code de cet immeuble a changé : saisissez le nouveau code."); }
      return this.open((A.imms[0]||{}).id||null);
    }
    A.role=r.role; S.canWrite=r.role==='admin'||r.role==='gestion';
    const im=r.immeuble||{}; S.config={...(im.data||{}), nom:im.nom||''}; S.hasLecture=!!im.lecture;
    const it=A.imms.find(i=>i.id===IMM); if(it) it.nom=im.nom||'';
    COLS.forEach(c=>S[c]=[]);
    (r.docs||[]).forEach(d=>{ if(S[d.col]) S[d.col].push({id:d.id,...d.data}); });
    S.loaded={config:true,etages:true,apparts:true,paiements:true,depenses:true}; S.mode='db'; schedule();
  },
  async add(col,data){ const id=await rpc('syndic_doc_ajouter',{p_code:A.code,p_imm:IMM,p_col:col,p_data:data}); if(!id) throw denied(); S[col]=[...S[col],{id,...data}]; schedule(); return id; },
  async set(col,id,data){ const r=await rpc('syndic_doc_modifier',{p_code:A.code,p_imm:IMM,p_id:id,p_data:data}); if(!r) throw denied(); S[col]=S[col].map(x=>x.id===id?{id,...data}:x); schedule(); },
  async del(col,id){ const r=await rpc('syndic_doc_supprimer',{p_code:A.code,p_imm:IMM,p_id:id}); if(!r) throw denied(); S[col]=S[col].filter(x=>x.id!==id); schedule(); },
  async setConfig(data){ const {nom='',...rest}=data; const r=await rpc('syndic_config_modifier',{p_code:A.code,p_imm:IMM,p_nom:nom,p_data:rest}); if(!r) throw denied(); S.config={...data}; const i=A.imms.find(x=>x.id===IMM); if(i) i.nom=nom; schedule(); },
  async createImmeuble(nom,gestion,lecture){
    const adm=A.keys.find(k=>k.role==='admin'); if(!adm) throw denied();
    const id=await rpc('syndic_imm_creer',{p_admin:adm.code,p_nom:nom,p_gestion:gestion,p_lecture:lecture||''});
    if(!id){ const e=new Error('Ce code de gestion ou de lecture est déjà utilisé, ou trop court (6 caractères minimum).'); throw e; }
    adm.imms.push({id,nom}); mergeKeys(); await this.open(id); return id;
  }
};
async function guard(fn,okMsg){
  if(!S.canWrite){ toast("Votre code donne un accès en lecture seule à cet immeuble."); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    console.error(e);
    if(e&&e.code==='denied') toast("Modification refusée : le code a peut-être été changé. Rechargez la page.");
    else if(navigator.onLine===false) toast("Pas de connexion internet. Réessayez quand la connexion revient.");
    else toast("L'enregistrement a échoué : "+((e&&e.message)||'erreur inconnue'));
    return false;
  }
}

/* ================= écran du code d'accès ================= */
async function appInit(){
  if(!SB){ A.ready=true; schedule(); return; }
  try{ await Store.start(); }catch(e){ console.error(e); S.mode='error'; A.err=(e&&e.message)||'Erreur de connexion'; }
  A.ready=true; schedule();
}
function codeScreen(){

const etById = id => S.etages.find(e=>e.id===id);
const apById = id => S.apparts.find(a=>a.id===id);
function etagesSorted(){return [...S.etages].sort((a,b)=>(+b.ordre||0)-(+a.ordre||0))}
function appartsOf(eid){return S.apparts.filter(a=>a.etageId===eid).sort((a,b)=>natCmp(a.numero,b.numero))}
function appartsSorted(){const out=[];etagesSorted().forEach(e=>out.push(...appartsOf(e.id)));S.apparts.filter(a=>!etById(a.etageId)).forEach(a=>out.push(a));return out}
function appDebut(a){return a.debut || S.config.debut || ym(S.year,1)}
function cotis(a){return +(a.cotisation ?? S.config.cotisationDefaut) || 0}
function paidMap(){ // appartId -> Map(monthKey -> paiement)
  const m=new Map();
  S.paiements.forEach(p=>{ if(p.type!=='cotisation'||!Array.isArray(p.mois))return; let mm=m.get(p.appartId); if(!mm){mm=new Map();m.set(p.appartId,mm)} p.mois.forEach(k=>mm.set(k,p)); });
  return m;
}
function arrears(a,pm){
  const paid=(pm||paidMap()).get(a.id)||new Map();
  const due=monthRange(appDebut(a),CUR_KEY).filter(k=>!paid.has(k));
  return {months:due, montant:due.length*cotis(a)};
}
function statusOf(n){ if(n===0) return ['ok','À jour']; if(n<=2) return ['warn',n+' mois en retard']; return ['bad',n+' mois en retard']; }
function soldeCaisse(){
  const ins=S.paiements.reduce((s,p)=>s+(+p.montant||0),0), outs=S.depenses.reduce((s,d)=>s+(+d.montant||0),0);
  return (+S.config.soldeInitial||0)+ins-outs;
}
function yearOf(d){return d?+d.slice(0,4):0}
function yearsAvailable(){
  const ys=new Set([NOW.getFullYear(),S.year]);
  const deb=S.config.debut; if(deb) for(let y=+deb.slice(0,4);y<=NOW.getFullYear();y++) ys.add(y);
  S.paiements.forEach(p=>{ys.add(yearOf(p.date));(p.mois||[]).forEach(k=>ys.add(+k.slice(0,4)))});
  S.depenses.forEach(d=>ys.add(yearOf(d.date)));
  ys.delete(0); return [...ys].sort();
}
function nextRecu(){return S.paiements.reduce((m,p)=>Math.max(m,+p.recu||0),0)+1}
function recuNo(p){return p.recu?String(p.recu).padStart(4,'0'):'—'}
function appLabel(a){ if(!a) return 'Lot supprimé'; const e=etById(a.etageId); return (a.type&&a.type!=='Appartement'?a.type+' ':'Appt ')+a.numero+(e?' · '+e.nom:''); }
function moisSummary(arr){ if(!arr||!arr.length) return ''; const s=[...arr].sort(); if(s.length===1) return keyLabel(s[0]);
  const contiguous = s.every((k,i)=>i===0||nextKey(s[i-1])===k);
  return contiguous ? keyLabel(s[0])+' → '+keyLabel(s[s.length-1])+' ('+s.length+' mois)' : s.length+' mois : '+s.map(keyLabel).join(', '); }

function vTableau(){
  if(!S.etages.length && !S.apparts.length) return onboarding();

  const pY=S.paiements.filter(p=>yearOf(p.date)===y), dY=S.depenses.filter(d=>yearOf(d.date)===y);

    </div></section>

}
function niceMax(v){ if(v<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return m*p; }
function barChart(a,b){
  const W=720,H=250,L=58,R=10,T=12,B=28, iw=W-L-R, ih=H-T-B;
  const mx=niceMax(Math.max(...a,...b)); const gw=iw/12, bw=Math.min(16,gw/2-4);
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=T+ih-ih*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line-2)" stroke-width="1"/><text x="${L-8}" y="${yy+3}" text-anchor="end">${nf0.format(v)}</text>`;}
  for(let m=0;m<12;m++){const cx=L+gw*m+gw/2;
    const ha=ih*a[m]/mx, hb=ih*b[m]/mx;
    g+=`<rect x="${cx-bw-1}" y="${T+ih-ha}" width="${bw}" height="${ha}" rx="2" fill="var(--accent)"><title>${MOIS[m]} · recettes ${dh(a[m])}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${T+ih-hb}" width="${bw}" height="${hb}" rx="2" fill="var(--exp)"><title>${MOIS[m]} · dépenses ${dh(b[m])}</title></rect>`;
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle">${MOIS[m]}</text>`;}
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="var(--line)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes et dépenses mensuelles en dirhams">${g}</svg>`;
}

/* ---------- États imprimables ---------- */
function minKey(a,b){return a<b?a:b}
function buildReleve(a,y,pm){
  pm=pm||paidMap(); const pa=pm.get(a.id)||new Map(); const c=cotis(a), deb=appDebut(a);
  const months=MOIS_L.map((lbl,i)=>{const k=ym(y,i+1); const p=pa.get(k)||null; const pre=k<deb;
    const state=p?'paid':pre?'pre':k<=CUR_KEY?'unpaid':'future'; return {k,lbl,p,state,du:pre?0:c};});
  const nPaid=months.filter(m=>m.state==='paid').length, nUnpaid=months.filter(m=>m.state==='unpaid').length;
  const nDue=months.filter(m=>m.state!=='pre'&&m.k<=CUR_KEY).length;
  const prevUnpaid=monthRange(deb,minKey(ym(y-1,12),CUR_KEY)).filter(k=>!pa.has(k));
  const pays=S.paiements.filter(p=>p.appartId===a.id&&yearOf(p.date)===y).sort((x,z)=>(x.date||'').localeCompare(z.date||''));
  const autres=pays.filter(p=>p.type!=='cotisation').reduce((s,p)=>s+(+p.montant||0),0);
  return {a,y,c,months,nPaid,nUnpaid,nDue,dueY:nDue*c,paidY:nPaid*c,impY:nUnpaid*c,avance:months.filter(m=>m.state==='paid'&&m.k>CUR_KEY).length,
    prevN:prevUnpaid.length,prev:prevUnpaid.length*c,reste:(prevUnpaid.length+nUnpaid)*c,pays,versements:pays.reduce((s,p)=>s+(+p.montant||0),0),autres,
    unpaidKeys:[...prevUnpaid,...months.filter(m=>m.state==='unpaid').map(m=>m.k)]};
}
function buildGlobal(y){
  const pm=paidMap(); const rows=appartsSorted().map(a=>buildReleve(a,y,pm));
  const ok=rows.filter(r=>r.reste===0), late=rows.filter(r=>r.reste>0).sort((x,z)=>z.reste-x.reste);
  const due=rows.reduce((s,r)=>s+r.dueY,0), paid=rows.reduce((s,r)=>s+r.paidY-r.avance*r.c,0);
  return {y,rows,ok,late,totPaid:rows.reduce((s,r)=>s+r.paidY,0),totImp:rows.reduce((s,r)=>s+r.reste,0),totImpY:rows.reduce((s,r)=>s+r.impY,0),
    taux:due?Math.round(paid/due*100):100,arrete:y<NOW.getFullYear()?'31/12/'+y:fdate(TODAY)};
}

/* ---------- génération PDF ---------- */
function T(s){return String(s??'').replace(/→/g,'->').replace(/[−–—]/g,'-').replace(/[   ]/g,' ').replace(/[^\x00-\xFF€’Œœ…]/g,'')}
function pn(x){const v=(+x||0).toFixed(2).split('.');return v[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+v[1]+' DH'}
const C_INK=[22,28,36],C_MUT=[90,100,114],C_LINE=[205,212,220],C_OKF=[224,242,232],C_OKT=[28,122,75],C_BADF=[250,227,224],C_BADT=[174,42,33],C_HEAD=[24,33,44];
function pdfHead(doc,title,sub,right){
  const W=doc.internal.pageSize.getWidth(), c=S.config;
  doc.setTextColor(...C_INK); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(T(title),14,17);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...C_MUT);
  let y=22.5; const lines=[(c.nom||"Syndic de l'immeuble")+((c.adresse||c.ville)?' - '+[c.adresse,c.ville].filter(Boolean).join(', '):''), c.syndic?('Syndic : '+c.syndic+(c.telephone?' - '+c.telephone:'')):'', sub].filter(Boolean);
  lines.forEach(l=>{doc.text(T(l),14,y);y+=4.3});
  right.forEach((l,i)=>doc.text(T(l),W-14,17+i*4.6,{align:'right'}));
  doc.setDrawColor(...C_INK); doc.setLineWidth(.6); doc.line(14,y-1.5,W-14,y-1.5);
  return y+3;
}
function pdfBoxes(doc,y,boxes){
  const W=doc.internal.pageSize.getWidth(), n=boxes.length, gap=3, bw=(W-28-gap*(n-1))/n;
  boxes.forEach((b,i)=>{const x=14+i*(bw+gap); doc.setDrawColor(...C_LINE); doc.setLineWidth(.25); doc.roundedRect(x,y,bw,15,1,1);
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(...C_MUT); doc.text(T(b[0].toUpperCase()),x+3,y+5);
    doc.setFont('helvetica','normal'); doc.setFontSize(11.5); doc.setTextColor(...(b[2]==='bad'?C_BADT:b[2]==='ok'?C_OKT:C_INK)); doc.text(T(b[1]),x+3,y+11.5);});
  doc.setTextColor(...C_INK); return y+20;
}
function pdfSec(doc,y,txt){ const H=doc.internal.pageSize.getHeight(); if(y>H-30){doc.addPage();y=18} doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...C_INK); doc.text(T(txt),14,y); return y+2.5; }
function pdfTable(doc,y,opts){
  doc.autoTable(Object.assign({startY:y,theme:'grid',margin:{left:14,right:14,bottom:16},
    styles:{font:'helvetica',fontSize:8.5,cellPadding:1.6,lineColor:C_LINE,lineWidth:.15,textColor:C_INK,overflow:'linebreak'},
    headStyles:{fillColor:C_HEAD,textColor:255,fontStyle:'bold',fontSize:8},footStyles:{fillColor:[240,243,246],textColor:C_INK,fontStyle:'bold'}},opts));
  return doc.lastAutoTable.finalY+6;
}
function pdfColor(d,state){ if(d.section!=='body') return; if(state==='paid'){d.cell.styles.fillColor=C_OKF;d.cell.styles.textColor=C_OKT;d.cell.styles.fontStyle='bold'} else if(state==='unpaid'){d.cell.styles.fillColor=C_BADF;d.cell.styles.textColor=C_BADT;d.cell.styles.fontStyle='bold'} else if(state==='pre'){d.cell.styles.textColor=[160,168,178]} }
function pdfFooters(doc){
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...C_MUT);
    doc.text(T((S.config.nom||'Registre du Syndic')+' - édité le '+fdate(TODAY)),14,H-8); doc.text('Page '+i+' / '+n,W-14,H-8,{align:'right'});}
}
function pdfSign(doc,y,left){ const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(); if(y>H-34){doc.addPage();y=24} y+=12;
  doc.setDrawColor(...C_MUT);doc.setLineWidth(.2);doc.line(14,y,84,y);doc.line(W-84,y,W-14,y);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...C_MUT);
  doc.text(T(left),14,y+4.5);doc.text(T('Le syndic (signature et cachet)'),W-84,y+4.5); }
function pdfReleve(doc,R,first){

    body:[['Lot',T((a.type||'Appartement')+' n° '+a.numero+(e?' - '+e.nom:'')),'Cotisation mensuelle',pn(R.c)],['Propriétaire',T(a.proprietaire||'-'),'Téléphone',T(a.telephone||'-')],['Occupation',T((a.occupation||'-')+(a.locataire?' - '+a.locataire:'')),'Cotisations dues depuis',T(keyLong(appDebut(a)))]],

    foot:[['Total '+R.y,pn(R.months.reduce((s,m)=>s+m.du,0)),T(R.nPaid+' payé(s) - '+R.nUnpaid+' impayé(s)'),'','','']],
    columnStyles:{1:{halign:'right'}},didParseCell:d=>{if(d.column.index===2&&d.section==='body')pdfColor(d,R.months[d.row.index].state)}});
  if(R.pays.length){ y=pdfSec(doc,y,'Versements reçus en '+R.y);
    y=pdfTable(doc,y,{head:[['Date','Reçu n°','Objet','Mode','Montant']],body:R.pays.map(p=>[fdate(p.date),recuNo(p),T(p.type==='cotisation'?moisSummary(p.mois):(p.type==='exceptionnel'?'Contribution exceptionnelle':'Autre')+(p.note?' - '+p.note:'')),T(p.mode||''),pn(p.montant)]),
      foot:[['Total des versements','','','',pn(R.versements)]],columnStyles:{4:{halign:'right'}}}); }
  y=pdfSec(doc,y,R.unpaidKeys.length?'Mois restant à régler':'Situation');
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...C_INK);
  const txt=R.unpaidKeys.length?R.unpaidKeys.map(keyLong).join(', ')+' - soit '+pn(R.reste)+' ('+montantLettres(R.reste)+').':'Le copropriétaire est à jour de ses cotisations au '+arr+'.';
  const lines=doc.splitTextToSize(T(txt),doc.internal.pageSize.getWidth()-28); doc.text(lines,14,y+3); y+=3+lines.length*4.2;

function pdfGlobal(doc,G){

function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'immeuble'}
async function exportEtat(kind){

@page{size:A4 ${S.et.type==='global'?'landscape':'portrait'};margin:12mm}@media print{html,body{background:#fff!important;padding:0}.bar{display:none}.paper{box-shadow:none;max-width:none;padding:0;margin:0}.paper+.paper{break-before:page;margin-top:0}tr{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="bar"><button onclick="window.print()">Imprimer</button></div>${body}</body></html>`;

/* ================= modales ================= */
const M = document.getElementById('modal');
let lastFocus=null;
function openModal(html,wide){ lastFocus=document.activeElement; M.innerHTML=`<div class="sheet${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`; M.hidden=false; document.body.style.overflow='hidden'; const f=M.querySelector('input:not([type=hidden]):not([disabled]),select,textarea,button.primary'); if(f) setTimeout(()=>f.focus(),20); }
function closeModal(){ M.hidden=true; M.innerHTML=''; document.body.style.overflow=''; PF=null; if(lastFocus&&lastFocus.focus) try{lastFocus.focus()}catch(e){} }
function sheetHead(t,sub){ return `<div class="sheet-h"><div>${sub?`<div class="eyebrow">${sub}</div>`:''}<h2>${t}</h2></div><button class="icon-btn" data-act="close" aria-label="Fermer">${ICON.close}</button></div>`; }
function confirmBox(title,msg,onYes,label='Supprimer'){
  openModal(`${sheetHead(title)}<div class="sheet-b"><p style="margin:0">${msg}</p></div><div class="sheet-f"><button class="btn" data-act="close">Annuler</button><button class="btn primary" id="cf-yes" style="background:var(--bad);border-color:var(--bad);color:#fff">${label}</button></div>`);
  document.getElementById('cf-yes').onclick=async()=>{ document.getElementById('cf-yes').disabled=true; await onYes(); closeModal(); };
}
function fval(f,n){const el=f.elements[n];return el?el.value.trim():''}

/* étage */
function formEtage(e={}){
  const nextOrd = S.etages.length? Math.max(...S.etages.map(x=>+x.ordre||0))+1 : 0;
  openModal(`${sheetHead(e.id?'Modifier l\'étage':'Nouvel étage','Immeuble')}<form id="f-etage"><div class="sheet-b"><div class="form-grid">
    <div class="field"><label for="et-nom">Nom</label><input class="input" id="et-nom" name="nom" required value="${esc(e.nom||(nextOrd===0?'Rez-de-chaussée':nextOrd+(nextOrd===1?'er':'e')+' étage'))}"></div>
    <div class="field"><label for="et-ordre">Niveau (0 = RDC, −1 = sous-sol)</label><input class="input num" id="et-ordre" name="ordre" type="number" step="1" required value="${esc(e.ordre??nextOrd)}"></div>
  </div></div><div class="sheet-f"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);
  document.getElementById('f-etage').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;
    const d={nom:fval(f,'nom'),ordre:+fval(f,'ordre')||0};
    if(await guard(()=>e.id?Store.set('etages',e.id,d):Store.add('etages',d), e.id?'Étage modifié':'Étage ajouté')) closeModal();};
}

/* fiche appartement */
function ficheAppart(id){
  const a=apById(id); if(!a) return; const pm=paidMap(); const r=arrears(a,pm); const [c,l]=statusOf(r.months.length);
  const ps=S.paiements.filter(p=>p.appartId===id).sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  const totP=ps.reduce((s,p)=>s+(+p.montant||0),0);
  openModal(`${sheetHead(esc(appLabel(a)),esc(a.type||'Appartement'))}<div class="sheet-b">
   <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="chip ${c}">${l}</span><span class="num" style="font-size:1.1rem;color:${r.montant?'var(--bad)':'var(--ok)'}">${r.montant?'Reste dû : '+dh(r.montant):'Rien à payer à ce jour'}</span></div>
   <dl class="dl"><dt>Propriétaire</dt><dd>${esc(a.proprietaire||'—')}</dd><dt>Téléphone</dt><dd class="mono">${esc(a.telephone||'—')}</dd><dt>Occupation</dt><dd>${esc(a.occupation||'—')}${a.locataire?' · '+esc(a.locataire):''}</dd><dt>Cotisation</dt><dd class="num">${dh(cotis(a))} / mois depuis ${keyLong(appDebut(a))}</dd>${a.superficie?`<dt>Superficie</dt><dd class="num">${esc(a.superficie)} m²</dd>`:''}${a.titre?`<dt>Titre foncier</dt><dd>${esc(a.titre)}</dd>`:''}${a.note?`<dt>Note</dt><dd>${esc(a.note)}</dd>`:''}</dl>
   ${r.months.length?`<div><div class="eyebrow" style="margin-bottom:6px">Mois impayés (${r.months.length})</div><div class="mlist">${r.months.map(k=>`<span class="chip bad">${keyLabel(k)}</span>`).join('')}</div></div>`:''}
   <div><div class="eyebrow" style="margin-bottom:4px">Historique des paiements · ${dh(totP)}</div>${ps.length?`<div class="tbl-wrap"><table class="tbl"><tbody>${ps.map(p=>`<tr><td class="mono">${fdate(p.date)}</td><td>${p.type==='cotisation'?esc(moisSummary(p.mois)):esc(p.type==='exceptionnel'?'Contribution exceptionnelle':'Autre')}</td><td class="r num">${dh(p.montant)}</td><td class="r"><button class="icon-btn" data-act="recu" data-id="${p.id}" aria-label="Reçu">${ICON.recu}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:4px 0 0">Aucun paiement enregistré.</p>'}</div>
  </div><div class="sheet-f"><button class="btn" data-act="releve" data-id="${a.id}" style="margin-right:auto">${ICON.etats} Relevé imprimable</button>${wbtn('edit-appart',ICON.edit+' Modifier',`data-id="${a.id}"`)}${wbtn('add-paiement',ICON.plus+' Encaisser',`data-appart="${a.id}" ${r.months.length?'data-unpaid="1"':''}`,'btn primary')}</div>`,true);
}

/* paiement */
let PF=null;
function formPaiement(p={},opts={}){
  const isNew=!p.id;
  PF={id:p.id||null, appartId:p.appartId||opts.appart||'', type:p.type||'cotisation', sel:new Set(p.mois||[]), manual:!isNew, year:S.year};
  if(opts.mois){PF.sel.add(opts.mois);PF.year=+opts.mois.slice(0,4)}
  else if(PF.sel.size) PF.year=+[...PF.sel].sort()[0].slice(0,4);
  if(opts.unpaid && PF.appartId){ const a=apById(PF.appartId); const r=arrears(a); r.months.forEach(k=>PF.sel.add(k)); if(r.months.length) PF.year=+r.months[0].slice(0,4); }
  openModal(`${sheetHead(isNew?'Encaisser un paiement':'Modifier le paiement', isNew?'Reçu n° '+String(nextRecu()).padStart(4,'0'):'Reçu n° '+recuNo(p))}<form id="f-pay"><div class="sheet-b"><div class="form-grid">
    <div class="field full"><label for="pf-app">Lot</label><select class="input" id="pf-app" name="appartId" required><option value="">Choisir un lot…</option>${etagesSorted().map(e=>`<optgroup label="${esc(e.nom)}">${appartsOf(e.id).map(a=>`<option value="${a.id}" ${PF.appartId===a.id?'selected':''}>${esc((a.type&&a.type!=='Appartement'?a.type+' ':'Appt ')+a.numero)} — ${esc(a.proprietaire||'sans nom')}</option>`).join('')}</optgroup>`).join('')}</select></div>
    <div class="field"><label for="pf-type">Objet</label><select class="input" id="pf-type" name="type"><option value="cotisation" ${PF.type==='cotisation'?'selected':''}>Cotisation mensuelle</option><option value="exceptionnel" ${PF.type==='exceptionnel'?'selected':''}>Contribution exceptionnelle (travaux…)</option><option value="autre" ${PF.type==='autre'?'selected':''}>Autre recette</option></select></div>
    <div class="field"><label for="pf-date">Date de paiement</label><input class="input" id="pf-date" name="date" type="date" required value="${esc(p.date||TODAY)}"></div>
    <div class="field full" id="pf-months-wrap"></div>
    <div class="field"><label for="pf-montant">Montant (DH)</label><input class="input num" id="pf-montant" name="montant" type="number" min="0" step="0.01" required value="${esc(p.montant??'')}"></div>
    <div class="field"><label for="pf-mode">Mode de paiement</label><select class="input" id="pf-mode" name="mode">${MODES.map(m=>`<option ${(p.mode||'Espèces')===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="field"><label for="pf-ref">Référence (n° chèque, virement)</label><input class="input" id="pf-ref" name="reference" value="${esc(p.reference||'')}"></div>
    <div class="field"><label for="pf-note">Note</label><input class="input" id="pf-note" name="note" value="${esc(p.note||'')}"></div>
  </div><div id="pf-hint" class="note-box" hidden></div></div><div class="sheet-f"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary">${isNew?'Enregistrer le paiement':'Enregistrer'}</button></div></form>`,true);
  renderPF();
  const f=document.getElementById('f-pay');
  f.elements.appartId.onchange=e=>{PF.appartId=e.target.value;PF.sel.clear();PF.manual=false;renderPF()};
  f.elements.type.onchange=e=>{PF.type=e.target.value;PF.manual=PF.type!=='cotisation';renderPF()};
  f.elements.montant.oninput=()=>{PF.manual=true};
  f.onsubmit=async ev=>{ev.preventDefault();
    if(PF.type==='cotisation'&&!PF.sel.size){ toast('Cochez au moins un mois couvert par ce paiement.'); return; }
    const d={appartId:fval(f,'appartId'),type:PF.type,date:fval(f,'date'),mois:PF.type==='cotisation'?[...PF.sel].sort():[],montant:+fval(f,'montant')||0,mode:fval(f,'mode'),reference:fval(f,'reference'),note:fval(f,'note'),recu:p.recu||nextRecu()};
    const id=PF.id; let newId=null;
    const ok=await guard(async()=>{ if(id) await Store.set('paiements',id,d); else newId=await Store.add('paiements',d); }, id?'Paiement modifié':'Paiement enregistré · reçu n° '+String(d.recu).padStart(4,'0'));
    if(ok){ closeModal(); }
  };
}
function renderPF(){
  const w=document.getElementById('pf-months-wrap'); if(!w||!PF) return;
  const a=apById(PF.appartId); const hint=document.getElementById('pf-hint');
  if(PF.type!=='cotisation'){ w.innerHTML=''; w.hidden=true; hint.hidden=true; return; }
  w.hidden=false;
  if(!a){ w.innerHTML='<label>Mois couverts</label><div class="note-box">Choisissez d\'abord le lot.</div>'; hint.hidden=true; return; }
  const pm=paidMap(); const paid=pm.get(a.id)||new Map(); const deb=appDebut(a); const y=PF.year;
  const chips=MOIS.map((m,i)=>{const k=ym(y,i+1); const other=paid.has(k)&&paid.get(k).id!==PF.id; const pre=k<deb; const due=!other&&!pre&&k<=CUR_KEY;
    return `<div class="mchip ${due&&!PF.sel.has(k)?'due':''}"><input type="checkbox" id="pm-${k}" data-k="${k}" ${PF.sel.has(k)||other?'checked':''} ${other||pre?'disabled':''}><label for="pm-${k}">${m}<small>${other?'payé':pre?'—':due?'dû':'à venir'}</small></label></div>`}).join('');
  const r=arrears(a,pm); const unpaidNotSel=r.months.filter(k=>!PF.sel.has(k));
  w.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><label>Mois couverts · ${dh(cotis(a))}/mois</label><div style="display:flex;gap:6px;align-items:center">${unpaidNotSel.length?`<button type="button" class="btn sm" id="pf-all">Tous les impayés (${r.months.length})</button>`:''}<div class="year-sel"><button type="button" class="icon-btn" id="pf-yp" aria-label="Année précédente">${ICON.left}</button><span>${y}</span><button type="button" class="icon-btn" id="pf-yn" aria-label="Année suivante">${ICON.right}</button></div></div></div><div class="months">${chips}</div>`;
  w.querySelectorAll('input[data-k]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.k; if(cb.checked)PF.sel.add(k); else PF.sel.delete(k); updAmount(a); renderPF();});
  document.getElementById('pf-yp').onclick=()=>{PF.year--;renderPF()}; document.getElementById('pf-yn').onclick=()=>{PF.year++;renderPF()};
  const all=document.getElementById('pf-all'); if(all) all.onclick=()=>{r.months.forEach(k=>PF.sel.add(k));updAmount(a);renderPF()};
  updAmount(a);
  const sel=[...PF.sel].sort();
  if(sel.length){ hint.hidden=false; hint.innerHTML=`<strong>${sel.length} mois</strong> sélectionné${sel.length>1?'s':''} : ${esc(moisSummary(sel))} — attendu <span class="num">${dh(sel.length*cotis(a))}</span>`; } else hint.hidden=true;
}
function updAmount(a){ if(PF.manual) return; const el=document.getElementById('pf-montant'); if(el) el.value=(PF.sel.size*cotis(a)).toFixed(2); }

  document.getElementById('f-cfg').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;
    const d={...c,nom:fval(f,'nom'),adresse:fval(f,'adresse'),ville:fval(f,'ville'),syndic:fval(f,'syndic'),telephone:fval(f,'telephone'),cotisationDefaut:+fval(f,'cotisationDefaut')||0,debut:fval(f,'debut'),soldeInitial:+fval(f,'soldeInitial')||0};
    if(await guard(()=>Store.setConfig(d),'Paramètres enregistrés')) closeModal();};
}
/* assistant de structure */
function formGenerate(){
  const c=S.config;
  openModal(`${sheetHead('Générer la structure','Assistant')}<form id="f-gen"><div class="sheet-b"><div class="form-grid">
    <div class="field"><label for="g-ss">Sous-sols</label><input class="input num" id="g-ss" name="ss" type="number" min="0" max="5" value="0"></div>
    <div class="field"><label for="g-rdc">Rez-de-chaussée</label><select class="input" id="g-rdc" name="rdc"><option value="1">Oui</option><option value="0">Non</option></select></div>
    <div class="field"><label for="g-et">Nombre d'étages au-dessus du RDC</label><input class="input num" id="g-et" name="et" type="number" min="0" max="60" value="4" required></div>
    <div class="field"><label for="g-ap">Lots par niveau</label><input class="input num" id="g-ap" name="ap" type="number" min="1" max="30" value="2" required></div>
    <div class="field"><label for="g-num">Numérotation</label><select class="input" id="g-num" name="num"><option value="seq">Continue (1, 2, 3…)</option><option value="etage">Par étage (11, 12, 21, 22…)</option></select></div>
    <div class="field"><label for="g-cot">Cotisation mensuelle (DH)</label><input class="input num" id="g-cot" name="cot" type="number" min="0" step="0.01" value="${esc(c.cotisationDefaut||200)}" required></div>
  </div><div class="note-box" id="g-prev"></div></div><div class="sheet-f"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary" id="g-go">Créer</button></div></form>`);
  const f=document.getElementById('f-gen');
  const plan=()=>{const ss=+f.elements.ss.value||0,rdc=f.elements.rdc.value==='1',et=+f.elements.et.value||0,ap=Math.max(1,+f.elements.ap.value||1);
    const lv=[];for(let i=ss;i>=1;i--)lv.push({nom:'Sous-sol '+(ss>1?i:''),ordre:-i});if(rdc)lv.push({nom:'Rez-de-chaussée',ordre:0});for(let i=1;i<=et;i++)lv.push({nom:i+(i===1?'er':'e')+' étage',ordre:i});
    lv.forEach(l=>l.nom=l.nom.trim()); return {lv,ap};};
  const prev=()=>{const {lv,ap}=plan();document.getElementById('g-prev').innerHTML=`Création de <strong>${lv.length} niveaux</strong> et <strong>${lv.length*ap} lots</strong>. Les étages existants sont conservés.`;};
  f.oninput=prev; prev();
  f.onsubmit=async ev=>{ev.preventDefault(); const {lv,ap}=plan(); const cot=+f.elements.cot.value||0; const mode=f.elements.num.value; const btn=document.getElementById('g-go'); btn.disabled=true; btn.textContent='Création…';
    let seq=S.apparts.reduce((m,a)=>Math.max(m,parseInt(a.numero)||0),0);
    const ok=await guard(async()=>{
      if(!S.config.cotisationDefaut){ await Store.setConfig({...S.config,cotisationDefaut:cot,debut:S.config.debut||ym(S.year,1)}); }
      for(const l of lv){ const eid=await Store.add('etages',l);
        for(let j=1;j<=ap;j++){ const numero = mode==='etage' ? (l.ordre<0?'S'+(-l.ordre):l.ordre===0?'R':String(l.ordre))+j : String(++seq);
          await Store.add('apparts',{numero,type:l.ordre<0?'Garage':'Appartement',etageId:eid,occupation:'Propriétaire occupant',proprietaire:'',telephone:'',locataire:'',cotisation:cot,debut:S.config.debut||ym(S.year,1),superficie:'',titre:'',note:''}); } }
    },'Structure créée');
    if(ok){ closeModal(); S.view='immeuble'; schedule(); } };
}
/* reçu */
function recuHtml(p){
  const a=apById(p.appartId)||{}; const c=S.config;
  return `<div class="recu"><div class="recu-h"><div><div class="eyebrow">Reçu de paiement</div><h2>${esc(c.nom||'Syndic de l\'immeuble')}</h2><div class="muted" style="font-size:.82rem">${esc([c.adresse,c.ville].filter(Boolean).join(', '))}${c.syndic?'<br>Syndic : '+esc(c.syndic):''}${c.telephone?' · '+esc(c.telephone):''}</div></div><div style="text-align:right"><div class="eyebrow">N°</div><div class="big">${recuNo(p)}</div><div class="mono" style="font-size:.85rem">${fdate(p.date)}</div></div></div>
  <dl class="dl"><dt>Reçu de</dt><dd><strong>${esc(a.proprietaire||'—')}</strong></dd><dt>Lot</dt><dd>${esc(appLabel(apById(p.appartId)))}</dd><dt>Objet</dt><dd>${p.type==='cotisation'?'Cotisation de syndic — '+esc(moisSummary(p.mois)):esc(p.type==='exceptionnel'?'Contribution exceptionnelle':'Autre recette')}${p.note?' · '+esc(p.note):''}</dd><dt>Mode</dt><dd>${esc(p.mode||'')}${p.reference?' · réf. '+esc(p.reference):''}</dd></dl>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px"><div class="lettres" style="max-width:46ch">Arrêté le présent reçu à la somme de : ${esc(montantLettres(p.montant))}.</div><div class="big">${dh(p.montant)}</div></div>
  <div class="muted" style="font-size:.78rem;text-align:right;padding-top:18px">Signature et cachet du syndic</div></div>`;
}
function showRecu(id){ const p=S.paiements.find(x=>x.id===id); if(!p) return;
  openModal(`${sheetHead('Reçu n° '+recuNo(p),'Paiement')}<div class="sheet-b">${recuHtml(p)}</div><div class="sheet-f"><button class="btn" data-act="dl-recu" data-id="${p.id}">${ICON.dl} Télécharger le reçu</button><button class="btn primary" data-act="close">Fermer</button></div>`,true); }

/* ================= exports ================= */
function csv(rows){ return '﻿'+rows.map(r=>r.map(v=>{const s=String(v??'');return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n'); }
const num2=v=>(+v||0).toFixed(2).replace('.',',');
async function saveFile(filename,data){
  try{
    const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':filename.endsWith('.html')?'text/html;charset=utf-8':filename.endsWith('.pdf')?'application/pdf':'application/octet-stream';
    const blob=data instanceof Blob?data:new Blob([data],{type});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); toast('Fichier téléchargé');
  }catch(e){ toast("Le téléchargement n'a pas abouti."); }
}
function doExport(t){
  const name=(S.config.nom||'immeuble').replace(/[^\w\-]+/g,'-').toLowerCase();
  if(t==='paiements') return saveFile(`paiements-${name}.csv`,csv([['N° reçu','Date','Lot','Étage','Propriétaire','Objet','Mois couverts','Mode','Référence','Montant (DH)','Note'],...[...S.paiements].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(p=>{const a=apById(p.appartId)||{};return [recuNo(p),fdate(p.date),a.numero||'',(etById(a.etageId)||{}).nom||'',a.proprietaire||'',p.type,(p.mois||[]).join(' '),p.mode,p.reference||'',num2(p.montant),p.note||'']})]));
  if(t==='depenses') return saveFile(`depenses-${name}.csv`,csv([['Date','Poste','Libellé','Fournisseur','N° pièce','Mode','Montant (DH)','Note'],...[...S.depenses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>[fdate(d.date),d.categorie,d.libelle,d.fournisseur||'',d.piece||'',d.mode,num2(d.montant),d.note||''])]));
  if(t==='lots'){ const pm=paidMap(); return saveFile(`coproprietaires-${name}.csv`,csv([['Étage','Lot','Type','Propriétaire','Téléphone','Occupation','Locataire','Cotisation (DH)','Début','Mois impayés','Montant dû (DH)'],...appartsSorted().map(a=>{const r=arrears(a,pm);return [(etById(a.etageId)||{}).nom||'',a.numero,a.type||'',a.proprietaire||'',a.telephone||'',a.occupation||'',a.locataire||'',num2(cotis(a)),a.debut||'',r.months.length,num2(r.montant)]})])); }
  if(t==='grille'){ const pm=paidMap(),y=S.year; return saveFile(`suivi-cotisations-${y}-${name}.csv`,csv([['Étage','Lot','Propriétaire',...MOIS,'Payé (DH)','Impayé (DH)'],...appartsSorted().map(a=>{const pa=pm.get(a.id)||new Map();let p=0,u=0;const cells=MOIS.map((_,i)=>{const k=ym(y,i+1);if(pa.has(k)){p+=cotis(a);return 'Payé'}if(k<appDebut(a))return '—';if(k<=CUR_KEY){u+=cotis(a);return 'Impayé'}return ''});return [(etById(a.etageId)||{}).nom||'',a.numero,a.proprietaire||'',...cells,num2(p),num2(u)]})])); }
}

/* ================= actions ================= */
document.addEventListener('click',async e=>{
  if(e.target===M){ closeModal(); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act, id=b.dataset.id;
  switch(act){
    case 'nav': S.view=b.dataset.v; try{localStorage.setItem('syndic-view',S.view)}catch(x){} closeModal(); render(); window.scrollTo(0,0); break;
    case 'add-code': A.adding=true; A.msg=''; A.lastCode=''; closeModal(); render(); break;
    case 'code-cancel': A.adding=false; A.msg=''; render(); break;
    case 'forget-codes': confirmBox('Fermer sur cet appareil','Les codes mémorisés sur cet appareil seront oubliés. Il faudra les saisir de nouveau pour rouvrir les immeubles.',async()=>{ storeCodes([]); try{localStorage.removeItem('syndic-imm')}catch(x){} A.keys=[]; A.imms=[]; IMM=null; A.role=null; S.mode='code'; schedule(); },'Fermer'); break;
    case 'retry': S.mode='loading'; appInit(); break;
    case 'new-imm': formNewImm(); break;
    case 'gen-codes': { const p=b.dataset.p; const g=document.getElementById(p+'-g'), l=document.getElementById(p+'-l'); if(g) g.value=genCode(); if(l) l.value=genCode(); break; }
    case 'print': { const st=document.getElementById('page-size')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'page-size'})); st.textContent='@page{size:A4 '+(S.et.type==='global'?'landscape':'portrait')+';margin:12mm}'; window.print(); break; }
    case 'copy-url': { const u=siteUrl(); try{ await navigator.clipboard.writeText(u); toast('Lien copié'); }catch(x){ const r=document.createRange(); r.selectNodeContents(document.getElementById('site-url')); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); toast('Lien sélectionné : copiez-le avec Ctrl+C'); } break; }
    case 'del-lecture': confirmBox('Désactiver le code de lecture','Les personnes qui utilisent le code de lecture seule n’auront plus accès à cet immeuble.',async()=>{ try{ const r=await rpc('syndic_codes_modifier',{p_code:A.code,p_imm:IMM,p_gestion:'',p_lecture:''}); if(!r) throw denied(); toast('Code de lecture désactivé'); await Store.reload(); }catch(err){ toast('Échec : '+(err.message||'erreur')); } },'Désactiver'); break;
    case 'del-imm': { const nom=S.config.nom||'cet immeuble'; confirmBox('Supprimer l’immeuble',`Supprimer définitivement <strong>${esc(nom)}</strong> avec ses ${S.apparts.length} lots, ${S.paiements.length} paiements et ${S.depenses.length} dépenses ? Cette action est irréversible.`,async()=>{ try{ const adm=A.keys.find(k=>k.role==='admin'); const r=await rpc('syndic_imm_supprimer',{p_admin:adm.code,p_imm:IMM}); if(!r) throw denied(); A.keys.forEach(k=>k.imms=k.imms.filter(i=>i.id!==IMM)); mergeKeys(); try{localStorage.removeItem('syndic-imm')}catch(x){} S.view='tableau'; await Store.open((A.imms[0]||{}).id||null); toast('Immeuble supprimé'); }catch(err){ toast('Suppression impossible : '+(err.message||'erreur')); } },'Supprimer définitivement'); break; }
    case 'year': S.year+=+b.dataset.d; render(); break;
    case 'imm-mode': S.immMode=b.dataset.m; render(); break;
    case 'close': closeModal(); break;
    case 'add-etage': formEtage(); break;
    case 'edit-etage': formEtage(etById(id)); break;
    case 'del-etage': { const n=appartsOf(id).length; const et=etById(id);
      if(n){ toast(`${et.nom} contient ${n} lot${n>1?'s':''} : déplacez-les ou supprimez-les d'abord.`); break; }
      confirmBox('Supprimer l\'étage',`Supprimer « ${esc(et.nom)} » ?`,()=>guard(()=>Store.del('etages',id),'Étage supprimé')); break; }
    case 'add-appart': if(!S.etages.length){toast('Créez d\'abord un étage.');break;} formAppart({},b.dataset.etage); break;
    case 'edit-appart': formAppart(apById(id)); break;
    case 'open-appart': ficheAppart(id); break;
    case 'del-appart': { const a=apById(id); const ps=S.paiements.filter(p=>p.appartId===id);
      confirmBox('Supprimer le lot',`Supprimer ${esc(appLabel(a))}${a.proprietaire?' ('+esc(a.proprietaire)+')':''} ?${ps.length?` Ses <strong>${ps.length} paiement${ps.length>1?'s':''}</strong> seront aussi supprimés.`:''}`,
        ()=>guard(async()=>{for(const p of ps) await Store.del('paiements',p.id); await Store.del('apparts',id);},'Lot supprimé')); break; }
    case 'add-paiement': if(!S.apparts.length){toast('Ajoutez d\'abord des lots dans la vue Immeuble.');break;} formPaiement({},{appart:b.dataset.appart,mois:b.dataset.mois,unpaid:!!b.dataset.unpaid}); break;
    case 'edit-paiement': { const p=S.paiements.find(x=>x.id===id); if(!p) break; if(!S.canWrite){showRecu(id);break;} formPaiement(p); break; }
    case 'del-paiement': { const p=S.paiements.find(x=>x.id===id); confirmBox('Supprimer le paiement',`Supprimer le reçu n° ${recuNo(p)} de ${dh(p.montant)} ? Les mois couverts redeviendront impayés.`,()=>guard(()=>Store.del('paiements',id),'Paiement supprimé')); break; }
    case 'recu': showRecu(id); break;
    case 'dl-recu': { const p=S.paiements.find(x=>x.id===id); if(!p)break; const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
      saveFile(`recu-${recuNo(p)}.html`,`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Reçu ${recuNo(p)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap"><style>${css}\nbody{padding:32px;max-width:720px;margin:0 auto}</style></head><body>${recuHtml(p)}</body></html>`); break; }
    case 'add-depense': formDepense(); break;
    case 'edit-depense': formDepense(S.depenses.find(x=>x.id===id)); break;
    case 'del-depense': { const d=S.depenses.find(x=>x.id===id); confirmBox('Supprimer la dépense',`Supprimer « ${esc(d.libelle)} » de ${dh(d.montant)} ?`,()=>guard(()=>Store.del('depenses',id),'Dépense supprimée')); break; }
    case 'edit-config': formConfig(); break;
    case 'et-type': S.et.type=b.dataset.t; render(); break;
    case 'releve': S.view='etats'; if(id){S.et.type='lot';S.et.lot=id}else{S.et.type='global'} closeModal(); render(); window.scrollTo(0,0); break;
    case 'pdf': b.disabled=true; await exportEtat('pdf'); b.disabled=false; break;
    case 'html-print': exportEtat('html'); break;
    case 'gen-structure': formGenerate(); break;
    case 'export': doExport(b.dataset.t); break;
    case 'clear-examples': {
      const items=[...COLS.flatMap(c=>S[c].filter(x=>x.exemple).map(x=>[c,x.id]))];
      confirmBox('Supprimer les exemples',`${items.length} éléments d'exemple seront supprimés (étages, lots, paiements, dépenses). Vos propres saisies sont conservées.`,
        ()=>guard(async()=>{ for(const c of ['paiements','depenses','apparts','etages']) for(const [cc,i] of items) if(cc===c) await Store.del(c,i);
          if(S.config.exemple){ const {exemple,...rest}=S.config; await Store.setConfig({...rest,nom:'',adresse:'',ville:'',syndic:'',telephone:''}); } },'Exemples supprimés'),'Tout supprimer'); break; }
  }
});
document.addEventListener('input',e=>{
  const t=e.target; if(!t.id) return;
  if(t.id==='imm-q'){S.immQ=t.value;schedule()}
  else if(t.id==='fp-q'){S.fp.q=t.value;schedule()} else if(t.id==='fd-q'){S.fd.q=t.value;schedule()}
});
document.addEventListener('change',e=>{
  const t=e.target; const map={'fp-appart':['fp','appart'],'fp-mois':['fp','mois'],'fp-mode':['fp','mode'],'fd-cat':['fd','cat'],'fd-mois':['fd','mois']};
  if(map[t.id]){ const [o,k]=map[t.id]; S[o][k]=t.value; schedule(); }
  else if(t.id==='et-lot'){ S.et.lot=t.value; schedule(); }
  else if(t.id==='imm-switch'){ Store.open(t.value).catch(err=>{S.mode='error';A.err=err.message;schedule()}); S.view=S.view||'tableau'; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!M.hidden) closeModal(); });
document.addEventListener('submit',async e=>{
  const f=e.target; const btn=f.querySelector('button.primary');
  const val=n=>f.elements[n]?f.elements[n].value.trim():'';
  if(f.id==='f-first'||f.id==='f-newimm'){ e.preventDefault(); const g=val('gestion'), l=val('lecture');
    if(l&&l===g){ toast('Les deux codes doivent être différents.'); return; }
    if(btn) btn.disabled=true;
    try{ await Store.createImmeuble(val('nom'),g,l); closeModal(); S.view='immeuble'; toast('Immeuble créé. Notez bien ses codes.'); schedule(); }
    catch(err){ toast(err.message||'La création a échoué.'); if(btn) btn.disabled=false; } }
  if(f.id==='f-codes'){ e.preventDefault(); const g=val('gestion'), l=val('lecture');
    if(!g&&!l){ toast('Saisissez au moins un nouveau code.'); return; }
    if(g&&l&&g===l){ toast('Les deux codes doivent être différents.'); return; }
    if(btn) btn.disabled=true;
    try{ const r=await rpc('syndic_codes_modifier',{p_code:A.code,p_imm:IMM,p_gestion:g,p_lecture:l||null});
      if(!r) throw new Error('code déjà utilisé par un autre immeuble ou trop court (6 caractères minimum)');
      if(g&&A.role==='gestion'){ const old=A.code; storeCodes([...savedCodes().filter(c=>c!==old),g]); A.keys.forEach(k=>{ if(k.code===old) k.code=g; }); mergeKeys(); A.code=g; }
      toast('Codes enregistrés. Communiquez les nouveaux codes aux personnes concernées.'); await Store.reload(); }
    catch(err){ toast('Codes non enregistrés : '+(err.message||'erreur')); if(btn) btn.disabled=false; } }
  if(f.id==='f-admin'){ e.preventDefault(); const n=val('nouveau'); const adm=A.keys.find(k=>k.role==='admin'); if(!adm) return;
    if(btn) btn.disabled=true;
    try{ const ok=await rpc('syndic_admin_modifier',{p_ancien:adm.code,p_nouveau:n}); if(!ok) throw new Error('code trop court (8 caractères minimum) ou déjà utilisé');
      storeCodes([...savedCodes().filter(c=>c!==adm.code),n]); A.keys.forEach(k=>{ if(k.code===adm.code) k.code=n; }); mergeKeys(); A.code=(A.imms.find(i=>i.id===IMM)||{}).code||A.code;
      toast('Code administrateur changé. Notez-le bien.'); f.reset(); }
    catch(err){ toast('Échec : '+(err.message||'erreur')); }
    if(btn) btn.disabled=false; }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&IMM&&S.mode==='db'&&M.hidden) Store.reload().catch(()=>{}); });

let tt=0; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3200); }

render();
appInit();
})();
</script>
